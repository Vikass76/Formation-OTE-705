<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci — Esprit Trading</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Rubik', sans-serif; background: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card {
      background: #fff;
      border-radius: 8px;
      max-width: 640px;
      width: 100%;
      padding: 60px 56px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card .emoji { font-size: 48px; margin-bottom: 20px; display: block; }
    .card h1 { font-size: 28px; font-weight: 900; color: #111; line-height: 1.2; margin-bottom: 28px; }
    .card p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 20px; }
    .card .btn {
      display: inline-block;
      background: #ffd700;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 30px;
      text-decoration: none;
      margin-top: 8px;
      cursor: pointer;
      border: none;
      font-family: 'Rubik', sans-serif;
    }
    .card .btn:hover { background: #e6c200; }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">🤝</span>
    <h1>Félicitations, tu es inscrit<br/>à la série de formation !</h1>
    <p>Vérifie ta boîte mail — tu vas recevoir un email contenant ta première leçon vidéo.</p>
    <p>Si tu dois resoumettre ton adresse email, clique sur le bouton ci-dessous :</p>
    <a href="leadmagnet.html" class="btn">Resoumettre mon email</a>
  </div>
</body>
</html>
